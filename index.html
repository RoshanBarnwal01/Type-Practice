<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="typing-container">

            <!-- =========================
                 TYPING TEST
            ========================== -->

            <div id="typing-test">

                <h1>Typing Practice</h1>

                <!-- Timer Selection -->

                <div class="timer-options">

                    <button class="time-button active" data-time="30">
                        30 sec
                    </button>

                    <button class="time-button" data-time="60">
                        1 min
                    </button>

                    <button class="time-button" data-time="120">
                        2 min
                    </button>

                </div>


                <!-- Timer -->

                <div class="timer">

                    <span class="timer-label">
                        Time
                    </span>

                    <span id="timer">
                        30
                    </span>

                </div>


                <!-- Loading Message -->

                <div id="loading-message">
                    Generating typing text...
                </div>


                <!-- Text -->

                <p id="text-to-type"></p>


                <!-- Typing Input -->

                <textarea
                    id="typing-input"
                    placeholder="Start typing here..."
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                ></textarea>


                <!-- Progress -->

                <div class="progress-container">

                    <div class="progress-bar">

                        <div id="progress-fill"></div>

                    </div>


                    <div class="progress-text">

                        <span id="progress-count">
                            0 / 0
                        </span>

                        <span id="progress-percentage">
                            0%
                        </span>

                    </div>

                </div>


                <!-- Live Statistics -->

                <div class="stats">

                    <div class="stat">

                        <span class="stat-label">
                            WPM
                        </span>

                        <span id="wpm">
                            0
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Accuracy
                        </span>

                        <span id="accuracy">
                            100%
                        </span>

                    </div>

                </div>


                <!-- Restart -->

                <button id="restart-button">
                    Restart
                </button>

            </div>


            <!-- =========================
                 RESULT SCREEN
            ========================== -->

            <div id="result-screen" class="result-screen">

                <h2>
                    Test Complete!
                </h2>


                <div class="result-stats">

                    <div class="result-stat">

                        <span class="result-label">
                            WPM
                        </span>

                        <span id="final-wpm">
                            0
                        </span>

                    </div>


                    <div class="result-stat">

                        <span class="result-label">
                            Accuracy
                        </span>

                        <span id="final-accuracy">
                            100%
                        </span>

                    </div>

                </div>


                <button id="try-again-button">
                    Try Again
                </button>


                <button id="history-button">
                    View History
                </button>

            </div>


            <!-- =========================
                 HISTORY
            ========================== -->

            <div id="history-section" class="history-section">

                <h2>
                    Typing History
                </h2>


                <!-- Overall Statistics -->

                <div class="statistics">

                    <div class="stat-card">

                        <span class="stat-card-label">
                            Best WPM
                        </span>

                        <span id="best-wpm">
                            0
                        </span>

                    </div>


                    <div class="stat-card">

                        <span class="stat-card-label">
                            Average WPM
                        </span>

                        <span id="average-wpm">
                            0
                        </span>

                    </div>


                    <div class="stat-card">

                        <span class="stat-card-label">
                            Best Accuracy
                        </span>

                        <span id="best-accuracy">
                            0%
                        </span>

                    </div>


                    <div class="stat-card">

                        <span class="stat-card-label">
                            Total Tests
                        </span>

                        <span id="total-tests">
                            0
                        </span>

                    </div>

                </div>


                <!-- History List -->

                <div id="history-list"></div>


                <!-- Clear History -->

                <button id="clear-history-button">
                    Clear History
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
